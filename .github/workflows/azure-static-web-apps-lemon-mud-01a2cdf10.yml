name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# Restrict default GitHub Actions permissions
permissions:
  contents: read

# Serialize runs per PR (or per branch for pushes). cancel-in-progress: false
# means a close event waits for an in-flight preview deploy instead of racing it.
concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    name: Build and Deploy Job
    runs-on: ubuntu-latest

    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - name: Get GitHub OIDC Token
        id: idtoken
        uses: actions/github-script@v7
        with:
          script: |
            return await core.getIDToken()
          result-encoding: string

      - name: Build and Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_MUD_01A2CDF10 }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: "dist"

  close_pull_request_job:
    name: Close Pull Request Job
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Log PR event context
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          echo "PR number:      $PR_NUMBER"
          echo "Merged:         $PR_MERGED"
          echo "Head ref:       $PR_HEAD_REF"
          echo "Head SHA:       $PR_HEAD_SHA"
          echo "Event SHA:      $EVENT_SHA"
          echo "Event ref:      $EVENT_REF"

      - name: Get GitHub OIDC Token
        id: idtoken
        uses: actions/github-script@v7
        with:
          script: |
            return await core.getIDToken()
          result-encoding: string

      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_MUD_01A2CDF10 }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: close
          